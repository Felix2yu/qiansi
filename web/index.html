<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- 主题色：静态默认值兜底（安装卡片 / 无 JS 场景），下方首屏脚本按用户偏好二次覆盖 -->
    <meta name="theme-color" content="#9E2A2B" />
    <!-- PWA 清单与 Service Worker 由 vite-plugin-pwa 在构建时注入（manifest.webmanifest + registerSW） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="牵丝" />
    <meta name="format-detection" content="telephone=no" />
    <title>牵丝 · 人际关系记录</title>
    <!-- 图标家族（契约见 ../../PWA规范.md） -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <script>
      // 首屏防闪：CSS 生效前先按偏好定好 dark class，否则深色用户会看到一帧白底。
      // 与 src/lib/theme.svelte.ts 的 applyTheme 保持同一套判定规则。
      (function () {
        try {
          var m = localStorage.getItem('q_theme_mode');
          if (m !== 'light' && m !== 'dark' && m !== 'system') {
            var legacy = localStorage.getItem('q_dark');
            m = legacy === '1' ? 'dark' : legacy === '0' ? 'light' : 'system';
          }
          var dark =
            m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.toggle('dark', dark);
          el.style.colorScheme = dark ? 'dark' : 'light';
          var c = localStorage.getItem('q_theme');
          if (c) el.style.setProperty('--q-theme', c);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#15120e' : c || '#9E2A2B');
          // 字号档位：与 theme.svelte.ts 的 FONT_SCALE_PX 保持同一套值
          var fs = localStorage.getItem('q_font_scale');
          if (fs === 's') el.style.fontSize = '15px';
          else if (fs === 'l') el.style.fontSize = '17px';
          else if (fs === 'xl') el.style.fontSize = '18px';
          // 字体族：重定向 CSS 变量（与 applyTheme 同一实现）
          var ff = localStorage.getItem('q_font_family');
          if (ff === 'serif') el.style.setProperty('--font-sans', 'var(--font-serif)');
          else if (ff === 'sans') el.style.setProperty('--font-serif', 'var(--font-sans)');
          // 金额打码：同样要抢在首帧之前挂 class，否则刷新时金额会明文闪现
          if (localStorage.getItem('q_money_mask') === '1') el.classList.add('q-money-mask');
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，忽略即可 */
        }
      })();
    </script>
    <!-- 首屏底色：CSS 包到达前先铺好宣纸/墨色，避免闪白 -->
    <style>
      html {
        background: #f2ede2;
      }
      html.dark {
        background: #15120e;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
