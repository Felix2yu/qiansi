# pnpm 11 起依赖覆盖配置从 package.json 的 pnpm.overrides 迁到此文件。
overrides:
  # @tailwindcss/node@4.3.3 声明 source-map-js ^1.2.1，而 <1.2.2 存在
  # GHSA-68fv-2mgg-jv7q（索引 source-map 段偏移导致事件循环拒绝服务），
  # 上游暂无更新版本，将整棵依赖树统一钉到补丁版。
  source-map-js: ^1.2.2
  # workbox-build（vite-plugin-pwa）传递引入的构建期依赖，
  # 父依赖声明的范围仍满足旧版，pnpm update 不会动，按告警钉到补丁版：
  # - fast-uri < 3.1.9：scheme 注入 / host 混淆等 4 项（GHSA-w74x-v6f9-j3xg 等）
  # - serialize-javascript < 7.1.3：XSS（GHSA-m5mm-p8h7-m29v）
  'fast-uri@<3.1.9': ^3.1.9
  'serialize-javascript@<7.1.3': '>=7.1.3'
