# 由 Felix2yu/.github/preset/dependabot.yml 生成 —— 升级时整份覆盖
# 设计理由见 Felix2yu/.github/docs/dependabot.md

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    # 默认只有 5，达到上限后会「静默停止」提新 PR 且不报错
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      go-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    # 默认只有 5，达到上限后会「静默停止」提新 PR 且不报错
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    # 与 preset 同步：typescript 的 major 不提 PR。web 的 typescript@~6 是 JS 编译器 API 宿主，
    # svelte-check 与 vite 插件链 require 它（本工程是 Svelte SPA，没有 svelte-kit sync，
    # 也没装 typescript-eslint），直接换成 7 会让 svelte-check 命中自身版本守卫、
    # 报出「需要同时装 TS7 与 TS6」的错误。TS7 已按「~6 宿主 + @typescript/native 别名 +
    # svelte-check --tsgo」这套装着，见 docs/dependabot.md 第六节
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    # 默认只有 5，达到上限后会「静默停止」提新 PR 且不报错
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "ci"

